name: 3 · Collect results

on:
  schedule:
    - cron: '30 17 * * *'   # 23:00 Asia/Kolkata
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: shorts-metrics
  cancel-in-progress: false

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Read-only, so it keeps learning even while posting is paused.
      - name: Collect views
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: node engine/metrics.js

      - name: Save results
        run: |
          git config user.name "shorts-bot"
          git config user.email "shorts-bot@users.noreply.github.com"
          git add content/ | true
          git diff --cached --quiet || git commit -m "metrics: $(date -u +%F)"
          git pull --rebase --autostash || true
          git push || true
