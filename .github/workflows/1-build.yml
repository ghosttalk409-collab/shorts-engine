name: 1 · Build tonight's shorts

on:
  schedule:
    - cron: '30 21 * * *'   # 03:00 Asia/Kolkata
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: shorts-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Kill switch
        id: guard
        run: node engine/guard.js

      - name: Get fonts
        if: steps.guard.outputs.run == 'true'
        run: node engine/fonts.js

      - name: Environment check
        if: steps.guard.outputs.run == 'true'
        run: node engine/check.js
        continue-on-error: true

      - name: Render candidates
        if: steps.guard.outputs.run == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node engine/build.js

      - name: Save queue
        if: steps.guard.outputs.run == 'true'
        run: |
          git config user.name "shorts-bot"
          git config user.email "shorts-bot@users.noreply.github.com"
          git add content/ | true
          git diff --cached --quiet || git commit -m "build: queued candidates for $(date -u +%F)"
          git pull --rebase --autostash || true
          git push || true
